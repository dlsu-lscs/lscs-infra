---
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'discord'

receivers:
  - name: 'discord'
    slack_configs:
      # 1. Use api_url instead of url
      # 2. Make SURE your Discord webhook URL ends with /slack
      - api_url: '${DISCORD_WEBHOOK_URL}'
        send_resolved: true
        # 3. channel is a required field for slack_configs, even though Discord ignores it
        channel: '#alerts'
