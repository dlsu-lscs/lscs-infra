---
services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - dokploy-network

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    env_file:
      - .env
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
    networks:
      - dokploy-network

  # --- Init container: renders the template into a shared volume ----
  alertmanager-config:
    image: alpine:latest
    env_file:
      - .env
    volumes:
      - ./alertmanager/alertmanager.template.yml:/template/alertmanager.template.yml:ro
      - ./alertmanager/generate-config.sh:/generate-config.sh:ro
      - alertmanager_config:/output
    command: ["sh", "/generate-config.sh"]

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    depends_on:
      alertmanager-config:
        condition: service_completed_successfully # waits for the init container to exit cleanly
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    volumes:
      - alertmanager_config:/etc/alertmanager:ro # reads from the shared volume
    networks:
      - dokploy-network

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - dokploy-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - dokploy-network

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_config: # shared between init container and alertmanager

networks:
  dokploy-network:
    external: true
